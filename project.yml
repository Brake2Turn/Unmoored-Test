# Fallback project definition for XcodeGen (https://github.com/yonaskolb/XcodeGen).
#
# Unmoored.xcodeproj is committed and is the source of truth. This spec exists
# so the project can be regenerated from scratch if the .xcodeproj is ever lost
# or hits a merge conflict:
#
#   brew install xcodegen && xcodegen generate
name: Unmoored
options:
  bundleIdPrefix: com.unmoored
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Unmoored:
    type: application
    platform: iOS
    sources:
      - Unmoored
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unmoored.game
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
